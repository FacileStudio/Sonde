name: fleet-scan

# The nightly fleet maintenance scan. It reads every FacileStudio repository
# through a read-only GitHub App, runs douane over the lockfiles, and delivers
# one report to Sonde. It never checks out or runs another repository's code.
#
# douane is verified against the sha256 pinned below, not against the
# checksums file of the same release, and every action is pinned to a commit.
#
# Off until the repository variable FLEET_SCAN_ENABLED is "true". Setup is in
# docs/FLEET.md. It has no pull_request trigger on purpose: the job holds the
# App key and the Sonde token, and a fork must never reach either.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      accept_shrink:
        description: "Confirm that repositories were really deleted or transferred, so a much shorter listing may resolve their findings"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fleet-scan
  cancel-in-progress: false

env:
  DOUANE_VERSION: "0.7.0"
  DOUANE_SHA256: "718745c1440905ff9c87c1d5eef866d3994beaec39e92f3c033835016f4d7dbb"

jobs:
  scan:
    if: ${{ vars.FLEET_SCAN_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache: false

      - name: Mint a read-only token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.FLEET_APP_CLIENT_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: FacileStudio
          permission-contents: read
          permission-actions: read

      - name: Install douane
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          archive="douane_${DOUANE_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/FacileStudio/douane/releases/download/v${DOUANE_VERSION}"
          curl -fsSLO "$base/$archive"
          echo "${DOUANE_SHA256}  $archive" | sha256sum -c -
          tar xzf "$archive" douane
          ./douane --version

      - name: Build fleetscan
        working-directory: apps/api
        run: go build -o "$RUNNER_TEMP/fleetscan" ./cmd/fleetscan

      - name: Scan and deliver
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          SONDE_URL: ${{ vars.SONDE_URL }}
          SONDE_FLEET_TOKEN: ${{ secrets.SONDE_FLEET_TOKEN }}
          DOUANE_BIN: ${{ runner.temp }}/douane
          FLEET_ACCEPT_SHRINK: ${{ inputs.accept_shrink && 'true' || 'false' }}
        run: '"$RUNNER_TEMP/fleetscan"'

      - name: Heartbeat
        env:
          SONDE_URL: ${{ vars.SONDE_URL }}
          FLEET_HEARTBEAT_TOKEN: ${{ secrets.FLEET_HEARTBEAT_TOKEN }}
        run: curl -fsS --max-time 30 --retry 2 --retry-all-errors -X POST "$SONDE_URL/api/push/$FLEET_HEARTBEAT_TOKEN"
