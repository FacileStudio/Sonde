<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!--
			scripts/rename.sh rewrites the name and the hostname in this file, so a fork
			inherits its own identity rather than the template's. Two things it cannot do
			for you: write a real description, and redraw the brand assets in static/
			(favicon.svg, the icon PNGs and og-image.png) from your own mark.

			og:url and og:image have to stay absolute — social scrapers do not resolve
			relative URLs.
		-->

		<script>
			(function () {
				try {
					var stored = localStorage.getItem('sonde-theme');
					document.documentElement.classList.toggle('dark', stored === 'dark');
					document.documentElement.classList.toggle('light', stored === 'light');
				} catch (e) {}
			})();
		</script>

		<title>Sonde · Uptime monitoring and status pages</title>
		<meta name="description" content="Heartbeats, multi-region probes and a public status page, with an alert as soon as a service goes down." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Facile" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://sonde.facile.studio/" />
		<meta property="og:title" content="Sonde · Uptime monitoring and status pages" />
		<meta property="og:description" content="Heartbeats, multi-region probes and a public status page, with an alert as soon as a service goes down." />
		<meta property="og:image" content="https://sonde.facile.studio/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Sonde: Uptime monitoring and status pages" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Sonde · Uptime monitoring and status pages" />
		<meta name="twitter:description" content="Heartbeats, multi-region probes and a public status page, with an alert as soon as a service goes down." />
		<meta name="twitter:image" content="https://sonde.facile.studio/og-image.png" />

		<meta name="color-scheme" content="light dark" />

		<script>
			(function () {
				if (location.hostname !== 'sonde.facile.studio') return;
				var s = document.createElement('script');
				s.async = true;
				s.src = 'https://vision.facile.studio/s.js';
				s.setAttribute('data-mask', '');
				document.head.appendChild(s);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
