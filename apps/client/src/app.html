<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!--
			scripts/rename.sh rewrites the name and the hostname in this file, so a fork
			inherits its own identity rather than the template's. Two things it cannot do
			for you: write a real description, and redraw the brand assets in static/
			(favicon.svg, the icon PNGs and og-image.png) from your own mark.

			og:url and og:image have to stay absolute — social scrapers do not resolve
			relative URLs.
		-->

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="GoSvelteBoilerplate" />
		<meta property="og:url" content="https://gosvelteboilerplate.facile.studio/" />
		<meta property="og:title" content="GoSvelteBoilerplate" />
		<meta
			property="og:description"
			content="GoSvelteBoilerplate — self-hosted software by Facile Studio."
		/>
		<meta property="og:image" content="https://gosvelteboilerplate.facile.studio/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="GoSvelteBoilerplate" />
		<meta
			name="twitter:description"
			content="GoSvelteBoilerplate — self-hosted software by Facile Studio."
		/>
		<meta name="twitter:image" content="https://gosvelteboilerplate.facile.studio/og-image.png" />
		%sveltekit.head%

		<title>GoSvelteBoilerplate</title>
		<meta
			name="description"
			content="GoSvelteBoilerplate — self-hosted software by Facile Studio."
		/>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
