services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sonde}
    expose:
    - '5432'
    volumes:
    - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '5432'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    expose:
    - '4000'
    networks:
    - default
    - dokploy-network
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.sonde-web.rule: Host(`sonde.facile.studio`)
      traefik.http.routers.sonde-web.entrypoints: web
      traefik.http.routers.sonde-web.middlewares: redirect-to-https@file
      traefik.http.routers.sonde-web.service: sonde-svc
      traefik.http.routers.sonde-secure.rule: Host(`sonde.facile.studio`)
      traefik.http.routers.sonde-secure.entrypoints: websecure
      traefik.http.routers.sonde-secure.tls.certresolver: letsencrypt
      traefik.http.routers.sonde-secure.service: sonde-svc
      traefik.http.services.sonde-svc.loadbalancer.server.port: '4000'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sonde}?sslmode=disable
      PORT: '4000'
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      SSO_ONLY: ${SSO_ONLY:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      OIDC_CLI_AUDIENCE: ${OIDC_CLI_AUDIENCE:-}
      ANTENNE_INSTANCE: ${ANTENNE_INSTANCE:-}
      ANTENNE_APP: ${ANTENNE_APP:-sonde}
      ANTENNE_SECRET: ${ANTENNE_SECRET:-}
      ANTENNE_INSTANCE_ID: ${ANTENNE_INSTANCE_ID:-}
      SONDE_RAW_RETENTION_DAYS: ${SONDE_RAW_RETENTION_DAYS:-30}
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '4000'
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
networks:
  dokploy-network:
    external: true
volumes:
  db_data:
    name: sonde_db_data
