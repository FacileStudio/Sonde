# Deployment shape for every Facile Go service. `scripts/rename.sh` rewrites the
# slug and the module path on fork; the routing below is what must NOT change.
#
# The suite standard is one public hostname per app:
#
#   <app>.facile.studio        -> the client
#   <app>.facile.studio/api/*  -> the API, matched by Traefik and forwarded here
#
# A backend never gets its own hostname. That keeps every browser request
# same-origin, so CORS is unnecessary, cookies stay first-party in Safari, and
# the built client image carries no environment-specific API URL.
#
# The API is `expose`d and never `ports`-published: only Traefik reaches it, over
# the shared dokploy-network.
#
# `stripprefix` below is correct for this boilerplate because its routes are
# registered at the root (`/auth/login`, not `/api/auth/login`). If a fork mounts
# its routes under `router.Route("/api", ...)` instead, DELETE the stripprefix
# middleware and its reference, or every route will 404. Sablier and Plume are
# the two apps in that second family.
#
# Compose labels REPLACE what Dokploy injects for a service, they do not merge
# with it. Declaring labels here therefore takes full ownership of this service's
# routing — which is what we want for the API, and why the client service is left
# for the panel unless you declare it fully here too.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gosvelteboilerplate}
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - "4000"
    networks:
      - default
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.gosvelteboilerplate-api-web.rule: "Host(`gosvelteboilerplate.facile.studio`) && PathPrefix(`/api`)"
      traefik.http.routers.gosvelteboilerplate-api-web.entrypoints: web
      traefik.http.routers.gosvelteboilerplate-api-web.middlewares: redirect-to-https@file
      traefik.http.routers.gosvelteboilerplate-api-web.service: gosvelteboilerplate-api-svc
      traefik.http.routers.gosvelteboilerplate-api-secure.rule: "Host(`gosvelteboilerplate.facile.studio`) && PathPrefix(`/api`)"
      traefik.http.routers.gosvelteboilerplate-api-secure.entrypoints: websecure
      traefik.http.routers.gosvelteboilerplate-api-secure.tls.certresolver: letsencrypt
      traefik.http.routers.gosvelteboilerplate-api-secure.middlewares: gosvelteboilerplate-strip-api
      traefik.http.routers.gosvelteboilerplate-api-secure.service: gosvelteboilerplate-api-svc
      traefik.http.middlewares.gosvelteboilerplate-strip-api.stripprefix.prefixes: /api
      traefik.http.services.gosvelteboilerplate-api-svc.loadbalancer.server.port: "4000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-gosvelteboilerplate}?sslmode=disable
      PORT: "4000"
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Same-origin in production, so this only matters for a cross-origin dev client.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
    healthcheck:
      # The image is distroless: no shell, no wget, no curl. Re-executing the
      # binary is the only probe available. Provided by tronc's healthcheck
      # package, which answers before any configuration is read.
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  # The client is served at Host(`gosvelteboilerplate.facile.studio`) with no path predicate, so
  # Traefik hands it everything the /api router did not match. Add it here with
  # the same label shape once the fork has an apps/client/Dockerfile; until then
  # its routing is panel-managed.
  #
  # Build it with a RELATIVE API base URL — `/api`, never an absolute host — so
  # the image is identical in every environment, and add a vite dev proxy for
  # `/api` so local development takes the same path as production.

networks:
  dokploy-network:
    external: true

volumes:
  db_data:
    name: gosvelteboilerplate_db_data
